<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel — Câmara Madre de Deus</title>
  <link rel="stylesheet" href="css/admin.css">
  <link rel="icon" href="favicon.png">
</head>

<body>
  <nav>
    <a href="painel.html">TOTEM</a>
    <a href="camara.html">CÂMARA</a>
  </nav>
  <div class="admin-layout">
    <header class="panel-header">
      <div>
        <h1>Painel de Mensagens</h1>
        <p>Gerencie as mensagens exibidas na sessão da Câmara.</p>
      </div>
      <div class="panel-actions">
        <button id="btn-nova" class="btn btn-primary" type="button">Nova mensagem</button>
        <button id="btn-sair" class="btn btn-secondary" type="button">Sair</button>
      </div>
    </header>

    <section class="panel-card">
      <table>
        <thead>
          <tr>
            <th>Imagem</th>
            <th>Título</th>
            <th>Conteúdo</th>
            <th>Publicar</th>            
          </tr>
        </thead>
        <tbody id="noticias-body"></tbody>
      </table>
    </section>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <div id="feedback" class="feedback" hidden></div>
      <div class="modal-header">
        <h2 id="modal-title">Nova mensagem</h2>
        <button id="btn-fechar-modal" class="btn btn-secondary" type="button">Fechar</button>
      </div>

      <form id="noticia-form">

        <label for="titulo">Título</label>
        <input id="titulo" name="titulo" required>

        <label for="conteudo">Conteúdo</label>
        <textarea id="conteudo" name="conteudo" required></textarea>

        <label for="imagem-arquivo">Imagem</label>
        <input id="imagem-arquivo" type="file" accept="image/*">
        <input id="imagem" name="imagem" type="hidden">
        <img id="imagem-preview" class="preview" hidden alt="Pré-visualização">

        <div class="modal-footer">
          <label for="publicar">Publicar</label>
          <input type="checkbox" id="publicar" name="publicar" checked>
          <button id="btn-cancelar" class="btn btn-secondary" type="button">Cancelar</button>
          <button class="btn btn-primary" type="submit">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/camara.js"></script>
</body>

</html>
