<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel — Câmara Madre de Deus</title>
  <link rel="stylesheet" href="css/admin.css">
  <link rel="icon" href="favicon.png">
  <style>
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: left;
      align-items: center;
      background-color: #004080;
      padding: 10px 20px;
      z-index: 1000;
      gap: 20px;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    body {
      margin-top: 60px;
      /* espaço para não ficar escondido atrás do menu */
    }
  </style>
</head>

<body>
  <!-- Menu superior fixo -->
  <nav>
    <a href="painel.html">TOTEM</a>
    <a href="camara.html">CÂMARA</a>
  </nav>
  <div class="admin-layout">
    <header class="panel-header">
      <div>
        <h1>Painel de Notícias</h1>
        <p>Gerencie as notícias exibidas no site da Câmara.</p>
      </div>
      <div class="panel-actions">
        <button id="btn-nova" class="btn btn-primary" type="button">Nova notícia</button>
        <button id="btn-sair" class="btn btn-secondary" type="button">Sair</button>
      </div>
    </header>

    <div id="feedback" class="feedback" hidden></div>

    <section class="panel-card">
      <table>
        <thead>
          <tr>
            <th>Imagem</th>
            <th>Título</th>
            <th>Resumo</th>
            <th>Conteúdo</th>
            <th>Detalhamento</th>
            <th>Publicar</th>
          </tr>
        </thead>
        <tbody id="noticias-body"></tbody>
      </table>
    </section>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modal-title">Nova notícia</h2>
        <button id="btn-fechar-modal" class="btn btn-secondary" type="button">Fechar</button>
      </div>

      <form id="noticia-form">

        <label for="titulo">Título</label>
        <input id="titulo" name="titulo" required>

        <label for="resumo">Resumo</label>
        <textarea id="resumo" name="resumo" required></textarea>

        <label for="conteudo">Conteúdo</label>
        <textarea id="conteudo" name="conteudo" required></textarea>

        <label for="detalhamento">Detalhamento</label>
        <textarea id="detalhamento" name="detalhamento" required></textarea>

        <label for="imagem-arquivo">Imagem</label>
        <input id="imagem-arquivo" type="file" accept="image/*">
        <input id="imagem" name="imagem" type="hidden">
        <img id="imagem-preview" class="preview" hidden alt="Pré-visualização">

        <div class="modal-footer">
          <label for="publicar">Publicar</label>
          <input type="checkbox" id="publicar" name="publicar" checked>
          <button id="btn-cancelar" class="btn btn-secondary" type="button">Cancelar</button>
          <button class="btn btn-primary" type="submit">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="js/painel.js"></script>
</body>

</html>
